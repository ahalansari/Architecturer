# Architecturer behind a Cloudflare Tunnel (e.g. on Unraid with the Compose Manager plugin).
# 1. Copy .env.example to .env and fill it in.
# 2. In Cloudflare Zero Trust: create the tunnel (token → CLOUDFLARE_TUNNEL_TOKEN) and add a public hostname
#    arch.<domain> → http://architecturer:5178. No Cloudflare Access: the server has its own login.
# 3. docker compose up -d, then open https://arch.<domain>/setup with the setup code from
#    `docker compose logs architecturer` to create your account (docs/REMOTE_MCP.md).
services:
  architecturer:
    build: .
    image: aalansari/architecturer:latest
    restart: unless-stopped
    env_file: .env
    environment:
      ARCHITECTURER_WORKERS: ${ARCHITECTURER_WORKERS:-1}
    volumes:
      # on Unraid use a cache / disk path, not /mnt/user (file change events are unreliable through shfs)
      - ${ARCHITECTURER_DATA:-./data}:/data
    # no published port: only cloudflared reaches it. Uncomment to also use it on the LAN.
    # ports:
    #   - "5178:5178"
    # one export of a big furnished plan peaks around 3.5 GB; allow ~3.5 GB per worker plus 0.5 GB
    mem_limit: ${ARCHITECTURER_MEMORY:-4g}
    cpus: ${ARCHITECTURER_CPUS:-2}
    # NVIDIA GPU for the path-traced renders (NVIDIA Container Toolkit / Unraid Nvidia Driver plugin).
    # Without one, delete this block: renders fall back to the CPU rasteriser.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, graphics]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      architecturer:
        condition: service_healthy
